<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>A legally nervous grey rectangle</title>
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#9AA0A6"/>
      <rect width="5" height="14" fill="#8B9196"/>
    </pattern>
  </defs>
  <rect width="240" height="240" fill="url(#hatch)"/>
  <rect x="18" y="72" width="204" height="96" rx="6" fill="#F8F9FA" stroke="#1A1A2E" stroke-width="5"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" text-anchor="middle" fill="#1A1A2E">
    <text x="120" y="104" font-size="15" letter-spacing="1">LIKENESS WITHHELD</text>
    <text x="120" y="128" font-size="11" letter-spacing="1">PENDING VEGETABLE</text>
    <text x="120" y="146" font-size="11" letter-spacing="1">REVIEW</text>
  </g>
  <g transform="rotate(-12 180 198)">
    <rect x="140" y="182" width="84" height="30" rx="4" fill="none" stroke="#A8201A" stroke-width="4"/>
    <text x="182" y="203" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="14" fill="#A8201A">LEGAL</text>
  </g>
</svg>
