<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>A terminal window listing more windows</title>
  <rect width="240" height="240" fill="#2F4858"/>
  <rect x="16" y="30" width="208" height="180" rx="10" fill="#111827" stroke="#1A1A2E" stroke-width="6"/>
  <path d="M16 40 Q16 30 26 30 H214 Q224 30 224 40 V56 H16 Z" fill="#374151"/>
  <g fill="#6B7280"><circle cx="32" cy="43" r="5"/><circle cx="48" cy="43" r="5"/><circle cx="64" cy="43" r="5"/></g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#7CFC9B">
    <text x="28" y="80">$ ls windows/</text>
    <text x="28" y="102" fill="#CFE8FF">house  bay  car</text>
    <text x="28" y="122" fill="#CFE8FF">airplane  drive-thru</text>
    <text x="28" y="142" fill="#CFE8FF">stained-glass  browser</text>
    <text x="28" y="162" fill="#CFE8FF">terminal  opportunity</text>
    <text x="28" y="188">$ </text>
